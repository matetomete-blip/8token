<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações — 8Token</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1818;
            --bg-card: #232121;
            --bg-card-alt: #1e1c1c;
            --border: #2d2a2a;
            --border-hover: #3d3939;
            --text-primary: #ffffff;
            --text-secondary: #b0abab;
            --text-muted: #7a7575;
            --accent-green: #10B981;
            --accent-red: #F43F5E;
            --accent-amber: #F59E0B;
            --accent-blue: #006ffe;
            --accent-orange: #f05409;
            --accent-orange-hover: #d44a08;
            --glow-orange: rgba(240, 84, 9, 0.15);
            --space-unit: 4px;
            --space-xs: calc(var(--space-unit) * 2);
            --space-sm: calc(var(--space-unit) * 3);
            --space-md: calc(var(--space-unit) * 4);
            --space-lg: calc(var(--space-unit) * 6);
            --space-xl: calc(var(--space-unit) * 8);
            --space-2xl: calc(var(--space-unit) * 12);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 999px;
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        a { color: inherit; text-decoration: none; transition: color var(--transition-fast); }
        a:hover { color: var(--accent-orange); }

        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(26,24,24,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .navbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-lg); display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .navbar-logo { display: flex; align-items: center; gap: var(--space-xs); font-weight: 700; font-size: 18px; }
        .navbar-logo svg { width: 28px; height: 28px; }
        .navbar-right { display: flex; align-items: center; gap: var(--space-md); }
        .btn-back { font-size: 13px; color: var(--text-secondary); padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; transition: all var(--transition-fast); display: inline-flex; align-items: center; gap: 6px; }
        .btn-back:hover { border-color: var(--accent-orange); color: var(--accent-orange); }

        .page { max-width: 800px; margin: 0 auto; padding: 112px var(--space-lg) 64px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-xl); flex-wrap: wrap; gap: var(--space-md); }
        .page-title { font-size: 24px; font-weight: 700; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .btn-mark-all { font-size: 13px; color: var(--accent-orange); padding: 8px 16px; border: 1px solid rgba(240,84,9,0.3); border-radius: var(--radius-sm); background: rgba(240,84,9,0.08); cursor: pointer; transition: all var(--transition-fast); font-weight: 600; }
        .btn-mark-all:hover { background: rgba(240,84,9,0.15); border-color: var(--accent-orange); }

        .notif-list { display: flex; flex-direction: column; gap: var(--space-sm); }
        .notif-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-lg); transition: all var(--transition-base); cursor: pointer; position: relative; }
        .notif-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
        .notif-card.unread { border-left: 3px solid var(--accent-orange); background: linear-gradient(90deg, rgba(240,84,9,0.04) 0%, var(--bg-card) 40%); }
        .notif-card.unread::after { content: ''; position: absolute; top: var(--space-lg); right: var(--space-lg); width: 8px; height: 8px; border-radius: 50%; background: var(--accent-orange); box-shadow: 0 0 8px rgba(240,84,9,0.5); }
        .notif-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-xs); }
        .notif-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .notif-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; font-family: var(--font-mono); }
        .notif-message { font-size: 14px; color: var(--text-secondary); line-height: 1.55; }
        .notif-type { display: inline-flex; align-items: center; padding: 2px 8px; font-size: 10px; font-weight: 700; border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.05em; margin-top: var(--space-sm); }
        .notif-type.info { background: rgba(0,111,254,0.12); color: var(--accent-blue); }
        .notif-type.success { background: rgba(16,185,129,0.12); color: var(--accent-green); }
        .notif-type.warning { background: rgba(245,158,11,0.12); color: var(--accent-amber); }
        .notif-type.error { background: rgba(244,63,94,0.12); color: var(--accent-red); }

        .empty-state { text-align: center; padding: var(--space-3xl, 64px) var(--space-lg); color: var(--text-muted); }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: var(--space-md); opacity: 0.4; }
        .empty-state p { font-size: 15px; }

        .filter-tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-lg); }
        .filter-tab { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-pill); cursor: pointer; transition: all var(--transition-fast); }
        .filter-tab:hover { color: var(--text-secondary); border-color: var(--border-hover); }
        .filter-tab.active { color: var(--accent-orange); border-color: var(--accent-orange); background: rgba(240,84,9,0.08); }
        .filter-tab .count { font-size: 11px; font-weight: 700; margin-left: 4px; }

        @media (max-width: 768px) {
            .navbar-inner { padding: 0 var(--space-md); }
            .page { padding: 96px var(--space-md) 48px; }
        }
        @media (max-width: 480px) {
            .page { padding: 88px var(--space-sm) 32px; }
            .page-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">
                <svg viewBox="0 0 48 48" fill="var(--accent-orange)" width="28" height="28">
                    <path d="M24 4C14 4 8 12 8 22v14c0 2 1 4 3 4h2l3-4h4l3 4h2l3-4h4l3 4h2c2 0 3-2 3-4V22C40 12 34 4 24 4zm-8 22a3 3 0 110-6 3 3 0 010 6zm16 0a3 3 0 110-6 3 3 0 010 6z"/>
                </svg>
                8Token
            </a>
            <div class="navbar-right">
                <button class="btn-back" onclick="window.location.href='dashboard.html'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Voltar ao Dashboard
                </button>
            </div>
        </div>
    </nav>

    <main class="page">
        <div class="page-header">
            <div>
                <h1 class="page-title">Notificações</h1>
                <p class="page-subtitle" id="notifSummary">Carregando...</p>
            </div>
            <button class="btn-mark-all" onclick="markAllRead()" id="markAllBtn" style="display:none;">
                Marcar todas como lidas
            </button>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterNotifs('all', this)">Todas <span class="count" id="countAll"></span></button>
            <button class="filter-tab" onclick="filterNotifs('unread', this)">Não lidas <span class="count" id="countUnread"></span></button>
            <button class="filter-tab" onclick="filterNotifs('read', this)">Lidas <span class="count" id="countRead"></span></button>
        </div>

        <div class="notif-list" id="notifList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <p>Carregando notificações...</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '';
        if (!localStorage.getItem('8token_token')) window.location.href = 'login.html';

        let allNotifications = [];
        let currentFilter = 'all';

        function timeAgo(dateStr) {
            const now = new Date();
            const date = new Date(dateStr);
            const diffMs = now - date;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHr = Math.floor(diffMs / 3600000);
            const diffDay = Math.floor(diffMs / 86400000);
            if (diffMin < 1) return 'agora';
            if (diffMin < 60) return diffMin + ' min atrás';
            if (diffHr < 24) return diffHr + 'h atrás';
            if (diffDay < 7) return diffDay + 'd atrás';
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function renderNotifications() {
            const list = document.getElementById('notifList');
            let filtered = allNotifications;
            if (currentFilter === 'unread') filtered = allNotifications.filter(n => !n.read);
            else if (currentFilter === 'read') filtered = allNotifications.filter(n => n.read);

            const unreadCount = allNotifications.filter(n => !n.read).length;
            const readCount = allNotifications.filter(n => n.read).length;
            document.getElementById('countAll').textContent = allNotifications.length ? '(' + allNotifications.length + ')' : '';
            document.getElementById('countUnread').textContent = unreadCount ? '(' + unreadCount + ')' : '';
            document.getElementById('countRead').textContent = readCount ? '(' + readCount + ')' : '';
            document.getElementById('notifSummary').textContent = unreadCount > 0
                ? unreadCount + ' notificação(ões) não lida(s) de ' + allNotifications.length + ' total'
                : allNotifications.length + ' notificação(ões) — todas lidas';
            document.getElementById('markAllBtn').style.display = unreadCount > 0 ? 'inline-flex' : 'none';

            if (!filtered.length) {
                const msg = currentFilter === 'unread' ? 'Nenhuma notificação não lida' : currentFilter === 'read' ? 'Nenhuma notificação lida ainda' : 'Nenhuma notificação ainda';
                list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>' + msg + '</p></div>';
                return;
            }

            list.innerHTML = filtered.map(n => `
                <div class="notif-card ${n.read ? '' : 'unread'}" onclick="markRead(${n.id})">
                    <div class="notif-header">
                        <span class="notif-title">${escHtml(n.title)}</span>
                        <span class="notif-time">${timeAgo(n.created_at)}</span>
                    </div>
                    <div class="notif-message">${escHtml(n.message)}</div>
                    <span class="notif-type ${n.type || 'info'}">${(n.type || 'info').toUpperCase()}</span>
                </div>
            `).join('');
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function filterNotifs(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderNotifications();
        }

        async function markRead(id) {
            const notif = allNotifications.find(n => n.id === id);
            if (notif && !notif.read) {
                try {
                    await fetch(API_BASE + '/api/notifications/' + id + '/read', {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('8token_token') }
                    });
                    notif.read = true;
                    renderNotifications();
                } catch (e) { console.error(e); }
            }
        }

        async function markAllRead() {
            try {
                await fetch(API_BASE + '/api/notifications/read-all', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('8token_token') }
                });
                allNotifications.forEach(n => n.read = true);
                renderNotifications();
            } catch (e) { console.error(e); }
        }

        async function loadNotifications() {
            try {
                const res = await fetch(API_BASE + '/api/notifications', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('8token_token') }
                });
                if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; return; }
                allNotifications = await res.json();
                renderNotifications();
            } catch (e) {
                document.getElementById('notifList').innerHTML = '<div class="empty-state"><p>Erro ao carregar notificações.</p></div>';
            }
        }
        loadNotifications();
    </script>
</body>
</html>
