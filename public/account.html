<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta 8Token</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* DESIGN SYSTEM V2 — Account Page */
:root {
--bg-primary: #050505;
--bg-secondary: #0A0A0A;
--bg-card: rgba(17, 17, 17, 0.9);
--border: #222222;
--border-hover: #333333;
--text-primary: #FFFFFF;
--text-secondary: #A0A0A0;
--text-muted: #555555;
--accent-orange: #FF5500;
--accent-orange-glow: rgba(255, 85, 0, 0.25);
--accent-blue: #00D4FF;
--accent-green: #00FF94;
--accent-red: #FF3333;
--space-xs: 8px;
--space-sm: 16px;
--space-md: 24px;
--space-lg: 32px;
--space-xl: 48px;
--font-sans: 'Inter', sans-serif;
--font-mono: 'JetBrains Mono', monospace;
--radius-sm: 8px;
--radius-md: 12px;
--radius-lg: 16px;
--glass: blur(10px);
--transition: all 0.3s ease-in-out;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: var(--font-sans);
background-color: var(--bg-primary);
color: var(--text-primary);
line-height: 1.6;
min-height: 100vh;
background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg-primary) 60%);
background-attachment: fixed;
}
a { text-decoration: none; color: inherit; transition: var(--transition); }
/* Navbar */
.navbar {
position: fixed; top: 0; left: 0; right: 0; z-index: 100;
background: rgba(5, 5, 5, 0.8); backdrop-filter: var(--glass);
border-bottom: 1px solid var(--border); height: 80px;
display: flex; align-items: center;
}
.nav-inner {
max-width: 1400px; margin: 0 auto; width: 100%; padding: 0 var(--space-md);
display: flex; justify-content: space-between; align-items: center;
}
.logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: var(--space-xs); }
.logo svg { width: 32px; height: 32px; fill: var(--accent-orange); }
.nav-actions { display: flex; align-items: center; gap: var(--space-md); }
.user-pill {
display: flex; align-items: center; gap: var(--space-sm);
padding: 8px 16px; background: rgba(255,255,255,0.03);
border: 1px solid var(--border); border-radius: 999px;
}
.avatar {
width: 32px; height: 32px; border-radius: 50%;
background: var(--accent-orange); display: flex; align-items: center; justify-content: center;
font-weight: 700; font-size: 14px; color: white;
}
.btn-icon {
width: 40px; height: 40px; border-radius: var(--radius-sm);
border: 1px solid var(--border); background: transparent;
color: var(--text-secondary); cursor: pointer; transition: var(--transition);
display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { border-color: var(--accent-orange); color: var(--accent-orange); }
/* Layout */
.account-container {
max-width: 1400px; margin: 0 auto; padding: 120px var(--space-md) var(--space-xl);
display: grid; grid-template-columns: 280px 1fr; gap: var(--space-xl);
}
@media (max-width: 1024px) { .account-container { grid-template-columns: 1fr; } }
/* Sidebar */
.sidebar { display: flex; flex-direction: column; gap: var(--space-xs); }
.nav-link {
padding: 12px 16px; border-radius: var(--radius-sm);
color: var(--text-secondary); font-weight: 500; font-size: 14px;
display: flex; align-items: center; gap: var(--space-sm);
transition: var(--transition); border: 1px solid transparent;
}
.nav-link:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
.nav-link.active {
background: rgba(255, 85, 0, 0.1); color: var(--accent-orange);
border-color: rgba(255, 85, 0, 0.2);
}
.nav-link svg { width: 20px; height: 20px; opacity: 0.7; }
.nav-link.active svg { opacity: 1; }
/* Content Area */
.content-area { display: flex; flex-direction: column; gap: var(--space-lg); }
.card {
background: var(--bg-card); backdrop-filter: var(--glass);
border: 1px solid var(--border); border-radius: var(--radius-lg);
padding: var(--space-lg);
}
.section-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-md); display: flex; align-items: center; gap: var(--space-sm); }
/* Forms */
.form-group { margin-bottom: var(--space-md); }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.form-input {
width: 100%; height: 44px; padding: 0 var(--space-sm);
background: var(--bg-secondary); border: 1px solid var(--border);
border-radius: var(--radius-sm); color: var(--text-primary);
font-size: 14px; outline: none; transition: var(--transition);
}
.form-input:focus { border-color: var(--accent-orange); box-shadow: 0 0 0 2px var(--accent-orange-glow); }
/* Buttons */
.btn {
display: inline-flex; align-items: center; justify-content: center;
padding: 12px 24px; font-size: 14px; font-weight: 600;
border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
border: none; gap: var(--space-xs);
}
.btn-primary { background: var(--accent-orange); color: white; box-shadow: 0 0 15px var(--accent-orange-glow); }
.btn-primary:hover { background: #ff6b00; transform: translateY(-2px); }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-secondary:hover { border-color: var(--accent-orange); color: var(--accent-orange); }
/* Alert */
.alert { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-sm); font-size: 13px; margin-bottom: var(--space-md); display: none; }
.alert.success { background: rgba(0,255,148,0.1); border: 1px solid rgba(0,255,148,0.3); color: var(--accent-green); display: block; }
.alert.error { background: rgba(255,51,51,0.1); border: 1px solid rgba(255,51,51,0.3); color: var(--accent-red); display: block; }
/* Invoice list */
.invoice-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: var(--space-sm); }
.invoice-item:last-child { border-bottom: none; }
.invoice-info { flex: 1; min-width: 200px; }
.invoice-plan { font-size: 14px; font-weight: 600; }
.invoice-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.invoice-amount { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
.invoice-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; }
.invoice-status.paid { background: rgba(0,255,148,0.12); color: var(--accent-green); }
.invoice-status.pending { background: rgba(255,85,0,0.12); color: var(--accent-orange); }
/* Responsive */
@media (max-width: 768px) {
.account-container { padding-top: 100px; }
.nav-actions span { display: none; }
}
</style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
<div class="nav-inner">
<a href="/" class="logo">
<svg viewBox="0 0 48 48"><path d="M24 4C14 4 8 12 8 22v14c0 2 1 4 3 4h2l3-4h4l3 4h2l3-4h4l3 4h2c2 0 3-2 3-4V22C40 12 34 4 24 4zm-8 22a3 3 0 110-6 3 3 0 010 6zm16 0a3 3 0 110-6 3 3 0 010 6z"/></svg>
8Token
</a>
<div class="nav-actions">
<div class="user-pill">
<div class="avatar" id="userAvatar">U</div>
<span id="userEmail" style="font-size: 14px; font-weight: 500;">usuario@email.com</span>
</div>
<button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="handleLogout()">Sair</button>
</div>
</div>
</nav>
<div class="account-container">
<!-- Sidebar Navigation -->
<aside class="sidebar">
<a href="/dashboard" class="nav-link">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
Dashboard
</a>
<a href="/account" class="nav-link active">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
Minha Conta
</a>
<a href="#" class="nav-link">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
Chaves API
</a>
<a href="/affiliate" class="nav-link">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
Afiliados
</a>
<div style="height: 1px; background: var(--border); margin: var(--space-sm) 0;"></div>
<a href="#" class="nav-link" style="color: var(--accent-red);" onclick="handleLogout()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
Sair da Conta
</a>
</aside>
<!-- Main Content -->
<main class="content-area">
<header>
<h1 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Minha Conta</h1>
<p style="color: var(--text-secondary);">Gerencie suas informações pessoais, senha e histórico de pagamentos.</p>
</header>
<!-- Profile Section -->
<div class="card">
<div class="section-title">Informações Pessoais</div>
<div id="profileAlert" class="alert"></div>
<div class="form-group">
<label class="form-label">Nome</label>
<input type="text" id="profileName" class="form-input" placeholder="Seu nome completo">
</div>
<div class="form-group">
<label class="form-label">Email</label>
<input type="email" id="profileEmail" class="form-input" placeholder="seu@email.com">
</div>
<button class="btn btn-primary" onclick="saveProfile()">Salvar Alterações</button>
</div>
<!-- Password Section -->
<div class="card">
<div class="section-title">Alterar Senha</div>
<div id="passwordAlert" class="alert"></div>
<div class="form-group">
<label class="form-label">Senha Atual</label>
<input type="password" id="currentPassword" class="form-input" placeholder="••••••••">
</div>
<div class="form-group">
<label class="form-label">Nova Senha</label>
<input type="password" id="newPassword" class="form-input" placeholder="••••••••">
</div>
<div class="form-group">
<label class="form-label">Confirmar Nova Senha</label>
<input type="password" id="confirmPassword" class="form-input" placeholder="••••••••">
</div>
<button class="btn btn-primary" onclick="changePassword()">Alterar Senha</button>
</div>
<!-- Invoices Section -->
<div class="card">
<div class="section-title">Histórico de Pagamentos</div>
<div id="invoicesList">
<div style="text-align:center;padding:var(--space-xl);color:var(--text-muted);font-size:14px;">Carregando...</div>
</div>
</div>
</main>
</div>
<script>
const API_BASE = '';
const token = localStorage.getItem('8token_token');
if (!token) { window.location.href = '/login'; }
function handleLogout() {
localStorage.removeItem('8token_token');
localStorage.removeItem('8token_user');
localStorage.removeItem('8token_has_plan');
window.location.href = '/login';
}
// Load user profile
async function loadProfile() {
try {
const res = await fetch(API_BASE + '/api/user/profile', {
headers: { 'Authorization': 'Bearer ' + token }
});
if (res.status === 401 || res.status === 403) { handleLogout(); return; }
if (res.ok) {
const user = await res.json();
document.getElementById('userEmail').textContent = user.email;
document.getElementById('userAvatar').textContent = (user.email || 'U').charAt(0).toUpperCase();
document.getElementById('profileName').value = user.name || '';
document.getElementById('profileEmail').value = user.email || '';
}
} catch (e) { console.error('Load profile error:', e); }
}
loadProfile();
// Save profile
async function saveProfile() {
const name = document.getElementById('profileName').value.trim();
const email = document.getElementById('profileEmail').value.trim();
if (!name || !email) { showAlert('profileAlert', 'Nome e email são obrigatórios.', 'error'); return; }
try {
const res = await fetch(API_BASE + '/api/user/name', {
method: 'PUT',
headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
body: JSON.stringify({ name })
});
if (res.ok) {
showAlert('profileAlert', 'Perfil atualizado com sucesso!', 'success');
document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
} else {
const data = await res.json();
showAlert('profileAlert', data.error || 'Erro ao atualizar perfil.', 'error');
}
} catch (e) { showAlert('profileAlert', 'Erro de conexão.', 'error'); }
}
// Change password
async function changePassword() {
const current = document.getElementById('currentPassword').value;
const newPass = document.getElementById('newPassword').value;
const confirm = document.getElementById('confirmPassword').value;
if (!current || !newPass || !confirm) { showAlert('passwordAlert', 'Preencha todos os campos.', 'error'); return; }
if (newPass !== confirm) { showAlert('passwordAlert', 'As senhas não coincidem.', 'error'); return; }
if (newPass.length < 6) { showAlert('passwordAlert', 'A nova senha deve ter pelo menos 6 caracteres.', 'error'); return; }
try {
const res = await fetch(API_BASE + '/api/user/password', {
method: 'PUT',
headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
body: JSON.stringify({ current_password: current, new_password: newPass })
});
const data = await res.json();
if (res.ok) {
showAlert('passwordAlert', 'Senha alterada com sucesso!', 'success');
document.getElementById('currentPassword').value = '';
document.getElementById('newPassword').value = '';
document.getElementById('confirmPassword').value = '';
} else {
showAlert('passwordAlert', data.error || 'Erro ao alterar senha.', 'error');
}
} catch (e) { showAlert('passwordAlert', 'Erro de conexão.', 'error'); }
}
// Load invoices
async function loadInvoices() {
try {
const res = await fetch(API_BASE + '/api/invoices', {
headers: { 'Authorization': 'Bearer ' + token }
});
if (!res.ok) return;
const invoices = await res.json();
const container = document.getElementById('invoicesList');
if (!invoices.length) {
container.innerHTML = '<div style="text-align:center;padding:var(--space-lg);color:var(--text-muted);font-size:13px;">Nenhuma fatura encontrada.</div>';
return;
}
container.innerHTML = invoices.map(inv => `
<div class="invoice-item">
<div class="invoice-info">
<div class="invoice-plan">${inv.plan || '—'}</div>
<div class="invoice-date">${new Date(inv.created_at).toLocaleDateString('pt-BR')}</div>
</div>
<div style="text-align:right;">
<div class="invoice-amount">R$ ${(inv.amount || 0).toFixed(2)}</div>
<span class="invoice-status ${inv.status === 'paid' ? 'paid' : 'pending'}">${inv.status === 'paid' ? 'Pago' : 'Pendente'}</span>
</div>
</div>
`).join('');
} catch (e) { console.error('Load invoices error:', e); }
}
loadInvoices();
function showAlert(id, message, type) {
const el = document.getElementById(id);
el.textContent = message;
el.className = 'alert ' + type;
setTimeout(() => { el.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
