# Nginx configuration for 8token.tech
# Place this file at: /etc/nginx/sites-available/8token.tech
# Then symlink: sudo ln -s /etc/nginx/sites-available/8token.tech /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d 8token.tech -d www.8token.tech

server {
    listen 80;
    server_name 8token.tech www.8token.tech;

    # Redirect HTTP to HTTPS (after certbot setup, this will be automatic)
    # return 301 https://$server_name$request_uri;

    # Proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable caching for dynamic content
        proxy_cache_bypass $http_upgrade;

        # Critical for SSE streaming (AI API responses)
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Increase buffer sizes for large AI responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Static assets (optional optimization — Node.js already serves these)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}